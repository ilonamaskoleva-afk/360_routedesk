<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RouteDesk — MVP</title>
<style>
:root{--ink:#171b45;--muted:#73799f;--purple:#5638dc;--purple2:#765df1;--blue:#4389f5;--pale:#f2f1ff;--line:#e7e8fb;--green:#18b981;--orange:#f59a37;--red:#ef626e;--shadow:0 18px 50px rgba(65,66,145,.13)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{background:linear-gradient(135deg,#f4f3ff,#e9edff);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}
button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:var(--purple)}
.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr;gap:24px;padding:24px;max-width:1500px;margin:auto}
.sidebar{background:#222653;color:#fff;border-radius:24px;padding:24px 16px;display:flex;flex-direction:column;min-height:calc(100vh - 48px);box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;padding:4px 10px 24px}
.brandmark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#8e7aff,#4d31d3);display:grid;place-items:center;font-size:20px}
.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:#d8dafa;padding:13px 12px;border-radius:13px;text-align:left;display:flex;gap:12px;align-items:center;font-size:14px}
.nav button.active,.nav button:hover{background:linear-gradient(90deg,#654ce6,#7762ee);color:#fff}.nav .ico{width:20px;text-align:center;font-size:17px}
.user{margin-top:auto;border-top:1px solid #414574;padding:18px 8px 0;display:flex;align-items:center;gap:10px;font-size:13px}
.avatar{width:34px;height:34px;border-radius:50%;background:#8b79ef;color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.user small{display:block;color:#bfc3e8;margin-top:3px}
main{min-width:0}.topbar{display:flex;align-items:center;justify-content:space-between;margin:4px 4px 20px;gap:12px}
.topbar h1{font-size:24px;margin:0}.topbar p{margin:5px 0 0;color:var(--muted);font-size:13px}.top-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip,.ghost{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:10px 13px}
.primary{border:0;border-radius:13px;background:linear-gradient(100deg,var(--purple),var(--purple2));color:white;padding:13px 18px;font-weight:700;box-shadow:0 7px 16px #6247df30}
.primary:hover{filter:brightness(1.05)}.primary:disabled,.ghost:disabled{opacity:.5;cursor:not-allowed}
.danger{border:0;border-radius:13px;background:#fff1f2;color:#c63b4d;padding:13px 18px;font-weight:700}
.screen{display:none;animation:fade .22s ease}.screen.active{display:block}@keyframes fade{from{opacity:.4;transform:translateY(5px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}
.card{background:rgba(255,255,255,.94);border:1px solid #ebeafd;border-radius:19px;padding:18px;box-shadow:0 8px 25px rgba(76,77,151,.07)}
.kpi .symbol{width:38px;height:38px;border-radius:12px;background:#eff1ff;color:var(--blue);display:grid;place-items:center;font-size:19px}
.kpi strong{display:block;font-size:26px;margin:10px 0 3px}.muted{color:var(--muted)}.small{font-size:12px}.positive{color:var(--green)}.negative{color:var(--red)}
.two{grid-template-columns:1.25fr .9fr}.three{grid-template-columns:repeat(3,1fr)}.card h3{font-size:15px;margin:0 0 14px}
.chart{height:190px;width:100%;display:block}
.donut-wrap{display:flex;align-items:center;gap:20px}
.donut{width:142px;height:142px;border-radius:50%;position:relative;flex:none}
.donut:after{content:attr(data-total);position:absolute;inset:27px;background:#fff;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:22px}
.legend{display:grid;gap:10px;font-size:12px}.legend span{display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.section-title{font-size:18px;margin:0 0 15px}
.field{display:grid;gap:7px;margin-bottom:15px}.field label{font-size:13px;font-weight:650}
.field input,.field textarea,.field select{width:100%;border:1px solid #dfe1f8;border-radius:13px;padding:13px;background:#fbfbff;color:var(--ink);outline:none}
.field textarea{min-height:120px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{border-color:#8978f1;box-shadow:0 0 0 3px #8c7bf122}
.field-hint{font-size:11px;color:var(--muted)}.inline-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.upload{border:1.5px dashed #b9b5f2;border-radius:14px;padding:20px;text-align:center;background:#faf9ff;color:#6c60c7;display:block}
.upload input{display:none}
.result{background:linear-gradient(135deg,#f2efff,#edf4ff);border:1px solid #e3defe;border-radius:17px;padding:17px}
.result-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.check{width:42px;height:42px;border-radius:50%;background:#d9f8ec;color:#12a979;display:grid;place-items:center;font-size:23px}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.result-grid div{background:#ffffffb8;padding:12px;border-radius:12px}.result-grid small{color:var(--muted);display:block;margin-bottom:5px}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:5px 10px;font-size:11px;font-weight:700;background:#eeeaff;color:#5942d4;white-space:nowrap}
.pill.green{background:#e0f8ee;color:#119b70}.pill.orange{background:#fff1dd;color:#c47a18}.pill.red{background:#ffe8eb;color:#d44d60}.pill.blue{background:#e7f1ff;color:#2b6fd4}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;padding:12px 8px;border-bottom:1px solid var(--line)}
.table td{padding:14px 8px;border-bottom:1px solid #f0f0fa}.table tbody tr{cursor:pointer}.table tbody tr:hover{background:#f8f7ff}
.ticket{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid #f0f0fa}
.ticket:last-child{border:0}.ticket-icon{width:38px;height:38px;border-radius:12px;background:#f0efff;color:#5d48dc;display:grid;place-items:center;flex:none}
.ticket p{margin:5px 0;color:var(--muted);font-size:12px}
.timeline{position:relative;padding-left:28px}.timeline:before{content:'';position:absolute;left:10px;top:8px;bottom:8px;width:2px;background:#dedafa}
.step{position:relative;padding:0 0 22px}.step:before{content:'';position:absolute;left:-24px;top:2px;width:12px;height:12px;border:3px solid #fff;border-radius:50%;background:#6954e8;box-shadow:0 0 0 1px #b7aefa}
.step.done:before{background:var(--green)}.step.current:before{background:var(--orange)}.step strong{font-size:13px}.step p{margin:4px 0;color:var(--muted);font-size:12px}
.barline{height:8px;border-radius:99px;background:#eeedfb;overflow:hidden;flex:1}.barline i{height:100%;display:block;border-radius:99px;background:linear-gradient(90deg,#5940df,#8d7cf4)}
.metric-line{display:flex;align-items:center;gap:12px;margin:14px 0;font-size:12px}.metric-line b{width:110px;flex:none}.metric-line em{font-style:normal;width:42px;text-align:right;flex:none}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{border:1px solid var(--line);border-radius:999px;padding:9px 13px;background:#fff;color:var(--muted);font-size:12px}
.tabs button.active{background:var(--purple);color:#fff;border-color:var(--purple)}
.toast{position:fixed;right:25px;bottom:25px;background:#222653;color:white;padding:14px 18px;border-radius:13px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;z-index:20;max-width:320px}
.toast.show{opacity:1;transform:none}.mobile-nav{display:none}
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
.auth-card{width:min(440px,100%);background:#fff;border-radius:28px;overflow:hidden;box-shadow:var(--shadow)}
.auth-hero{background:linear-gradient(160deg,#5b43e6,#8a74f3);color:#fff;padding:32px 28px 26px;position:relative}
.auth-hero h1{margin:10px 0 6px;font-size:28px}.auth-hero p{margin:0;opacity:.88;font-size:14px}
.auth-body{padding:24px 28px 28px}
.demo-box{background:#f6f5ff;border:1px solid #eceaff;border-radius:14px;padding:12px 14px;font-size:12px;color:#4d4f86;margin-bottom:16px}
.demo-box b{display:block;margin-bottom:4px}
.linkish{background:none;border:0;color:var(--purple);padding:0;font-weight:650}
.comment{background:#f7f7ff;border-radius:14px;padding:12px;margin:10px 0}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.badge{min-width:18px;height:18px;border-radius:99px;background:#ef626e;color:#fff;font-size:10px;display:inline-grid;place-items:center;margin-left:6px}
.matrix td.hit{background:#e9fbf3;color:#119b70;font-weight:700}
.hidden{display:none!important}
.bell{position:relative}
.bell .dot-n{position:absolute;top:6px;right:8px;width:8px;height:8px;background:var(--red);border-radius:50%}
.empty{text-align:center;color:var(--muted);padding:28px 8px}
@media(max-width:950px){
  .app{grid-template-columns:1fr;padding:14px}.sidebar{display:none}
  .mobile-nav{display:flex;position:sticky;bottom:10px;z-index:5;background:#242852;color:white;border-radius:18px;padding:8px;justify-content:space-around;box-shadow:var(--shadow);margin-top:16px}
  .mobile-nav button{border:0;background:transparent;color:#d6d8f4;padding:9px 7px;border-radius:12px;font-size:11px}
  .mobile-nav button.active{background:#674ee5;color:white}
  .kpis{grid-template-columns:repeat(2,1fr)}.two,.three,.filters{grid-template-columns:1fr}
}
@media(max-width:560px){
  .app{padding:10px}.topbar h1{font-size:20px}.inline-fields,.result-grid{grid-template-columns:1fr}
  .table-wrap{overflow:auto}.table{min-width:640px}
}
</style>
</head>
<body>
<div id="authRoot"></div>
<div id="appRoot" class="hidden"></div>
<div class="toast" id="toast"></div>
<script>
const DEPTS = ['IT','АХО','Кадры','Бухгалтерия','Учебный отдел'];
const DEPT_FULL = {
  'IT':'Отдел технической поддержки',
  'АХО':'Административно-хозяйственный отдел',
  'Кадры':'Отдел кадров',
  'Бухгалтерия':'Бухгалтерия',
  'Учебный отдел':'Учебный отдел'
};
const COLORS = {IT:'#5638dc',АХО:'#4389f5',Кадры:'#f7b24b',Бухгалтерия:'#e88cae','Учебный отдел':'#8ac9d0'};
const STATUS = ['Новая','Назначена','В работе','Перенаправлена','Решена'];
const USERS = [
  {id:'ivan', login:'ivan', password:'1234', name:'Иван Иванов', role:'employee', dept:'Учебный отдел', position:'Преподаватель', email:'ivan@uni.ru', phone:'+7 900 111-22-33', initials:'ИИ'},
  {id:'petrov', login:'petrov', password:'1234', name:'Петров С.А.', role:'executor', dept:'IT', position:'Инженер техподдержки', email:'petrov@uni.ru', phone:'+7 900 222-33-44', initials:'ПС'},
  {id:'axo', login:'axo', password:'1234', name:'Сидорова А.В.', role:'executor', dept:'АХО', position:'Специалист АХО', email:'axo@uni.ru', phone:'+7 900 333-44-55', initials:'СА'},
  {id:'maria', login:'maria', password:'1234', name:'Мария Орлова', role:'manager', dept:'Администрация', position:'Руководитель сервиса', email:'maria@uni.ru', phone:'+7 900 555-66-77', initials:'МО'}
];
const STORE_KEY = 'routedesk-mvp-v1';

const state = {
  user: null,
  screen: 'home',
  selectedId: null,
  authView: 'login',
  recoverLogin: '',
  draft: {text:'', category:'Автоматически', priority:'Средний', file:''},
  ai: null,
  filters: {status:'Все', category:'Все', q:'', sort:'date_desc', from:'', to:''},
  inTab: 'mine',
  inPrio: 'Все',
  inSort: 'new',
  period: 30,
  compare: false,
  profile: {notifyAccept:true, notifyAssign:true, notifyRedirect:true, notifyDone:true}
};

function now(){ return Date.now(); }
function fmt(ts){
  const d = new Date(ts);
  const p = n => String(n).padStart(2,'0');
  return `${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()}, ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function fmtDay(ts){
  const d = new Date(ts);
  const p = n => String(n).padStart(2,'0');
  return `${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()}`;
}
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function userById(id){ return USERS.find(u=>u.id===id); }
function initials(u){ return (u&&u.initials)||'??'; }

function seed(){
  const t0 = new Date('2026-10-29T14:32:00').getTime();
  const tickets = [
    makeTicket({id:2486, title:'Протекает батарея в кабинете 214', text:'Протекает батарея в кабинете 214, лужа на полу.', category:'АХО', dept:'АХО', priority:'Средний', status:'Назначена', authorId:'ivan', assigneeId:null, confidence:88, createdAt:t0-42*60000, keywords:['батарея','кабинет']}),
    makeTicket({id:2485, title:'Оформление отпуска', text:'Нужно оформить отпуск с 10 ноября.', category:'Кадры', dept:'Кадры', priority:'Низкий', status:'Решена', authorId:'ivan', assigneeId:'maria', confidence:91, createdAt:t0-2*86400000, resolvedAt:t0-1.5*86400000, keywords:['отпуск']}),
    makeTicket({id:2484, title:'Консультация по учебному процессу', text:'Нужна консультация по учебному процессу для группы ИТ-21.', category:'Учебный отдел', dept:'Учебный отдел', priority:'Средний', status:'Назначена', authorId:'ivan', assigneeId:null, confidence:84, createdAt:t0-3*86400000, keywords:['учебный процесс']}),
    makeTicket({id:2489, title:'Проблема с доступом к учебной системе', text:'Не открывается личный кабинет, пишет ошибку доступа.', category:'IT', dept:'IT', priority:'Высокий', status:'Новая', authorId:'ivan', assigneeId:null, confidence:90, createdAt:t0+18*60000, keywords:['доступ','система']}),
    makeTicket({id:2488, title:'Протекает батарея в кабинете 214', text:'Повторно: протекает батарея в кабинете 214.', category:'АХО', dept:'АХО', priority:'Средний', status:'Новая', authorId:'ivan', assigneeId:null, confidence:87, createdAt:t0+8*60000, keywords:['батарея']})
  ];
  tickets[1].history.push({t:tickets[1].createdAt+3600000, title:'Решена', text:'Документы оформлены.', userId:'maria', kind:'done'});
  tickets[1].comments.push({t:tickets[1].createdAt+3500000, userId:'maria', text:'Приказ подготовлен, отпуск согласован.'});
  const notifications = [
    {id:1, userId:'ivan', ticketId:2485, type:'done', text:'Заявка №2485 решена', t:tickets[1].createdAt+3600000, read:false},
    {id:2, userId:'petrov', ticketId:2489, type:'new', text:'Новая заявка №2489 в вашем отделе', t:tickets[3].createdAt, read:false}
  ];
  return {tickets, notifications, nextId:2490, nextNid:3};
}

function makeTicket(p){
  const t = p.createdAt || now();
  return {
    id:p.id, title:p.title, text:p.text, category:p.category, dept:p.dept,
    priority:p.priority, status:p.status, authorId:p.authorId, assigneeId:p.assigneeId||null,
    confidence:p.confidence, explanation:p.explanation || `Ключевые слова: «${(p.keywords||[]).join('», «')}»`,
    createdAt:t, resolvedAt:p.resolvedAt||null, file:p.file||'',
    redirects:p.redirects||0, visited:[p.dept],
    history:[
      {t, title:'Создана', text:'Сотрудник '+ (userById(p.authorId)||{}).name, userId:p.authorId, kind:'created'},
      {t:t+60000, title:'Классифицирована', text:`${p.category} · ${p.confidence}%`, userId:'ai', kind:'ai'},
      {t:t+120000, title:'Назначена', text:DEPT_FULL[p.dept], userId:'ai', kind:'assign'}
    ],
    comments:[]
  };
}

function loadDB(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const db = JSON.parse(raw);
      if(db && Array.isArray(db.tickets)) return db;
    }
  }catch(e){}
  const db = seed();
  saveDB(db);
  return db;
}
function saveDB(db){ localStorage.setItem(STORE_KEY, JSON.stringify(db)); }
let db = loadDB();

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._tm); toast._tm = setTimeout(()=>t.classList.remove('show'), 2800);
}

function classify(text, manual){
  const s = (text||'').toLowerCase();
  let category = manual && manual!=='Автоматически' ? manual : null;
  let keywords = [];
  let confidence = 74;
  if(!category){
    if(/проект|компьютер|принтер|монитор|wi-?fi|сеть|доступ|логин|почт|vpn|ноутбук|техподдерж/.test(s)){
      category='IT'; keywords=[]; confidence=92;
      if(/проект/.test(s)) keywords.push('проектор');
      if(/аудитор|кабинет/.test(s)) keywords.push(s.match(/аудитор\w*/)?.[0] || 'аудитория');
      if(/компьютер/.test(s)) keywords.push('компьютер');
      if(/доступ|логин/.test(s)) keywords.push('доступ');
      if(/принтер/.test(s)) keywords.push('принтер');
      if(!keywords.length) keywords=['оборудование'];
    } else if(/отпуск|справк|кадр|трудов|больнич|прием на работ/.test(s)){
      category='Кадры'; keywords=['кадры']; confidence=89;
    } else if(/бух|счет|оплат|акт|финанс|зарплат|командировоч/.test(s)){
      category='Бухгалтерия'; keywords=['оплата']; confidence=86;
    } else if(/занят|расписан|студент|экзамен|учебн|групп/.test(s)){
      category='Учебный отдел'; keywords=['учебный процесс']; confidence=84;
    } else if(/батар|мебел|уборк|вода|сантех|отоплен|окно|дверь|ключ/.test(s)){
      category='АХО'; keywords=['хозяйство']; confidence=86;
    } else if(/аудитор|кабинет/.test(s)){
      category='АХО'; keywords=['кабинет']; confidence=78;
    } else {
      category='IT'; keywords=['общее обращение']; confidence=62;
    }
  } else {
    keywords = ['указано вручную'];
    confidence = 99;
  }
  if(/завтра|лекц|срочно|не работает/.test(s) && category==='IT') confidence = Math.max(confidence, 92);
  return {
    category,
    dept: category,
    deptName: DEPT_FULL[category],
    confidence,
    explanation: confidence<70
      ? 'Уверенность невысокая: проверьте категорию вручную.'
      : `Ключевые слова: «${keywords.filter(Boolean).slice(0,3).join('», «')}»`
  };
}

function addHistory(ticket, title, text, kind){
  ticket.history.push({t:now(), title, text, userId:state.user.id, kind});
}
function notify(userId, ticketId, type, text){
  db.notifications.unshift({id:db.nextNid++, userId, ticketId, type, text, t:now(), read:false});
}
function unreadCount(){
  return db.notifications.filter(n=>n.userId===state.user.id && !n.read).length;
}

function pillStatus(st){
  if(st==='Решена') return 'green';
  if(st==='В работе') return '';
  if(st==='Новая' || st==='Назначена') return 'orange';
  if(st==='Перенаправлена') return 'red';
  return 'blue';
}
function pillPrio(p){
  if(p==='Высокий') return 'red';
  if(p==='Низкий') return 'green';
  return 'orange';
}

function roleLabel(u){
  return {employee:'Сотрудник', executor:'Исполнитель', manager:'Руководитель'}[u.role];
}

function navItems(){
  const u = state.user;
  if(u.role==='employee') return [
    ['home','⌂','Главная'],['create','＋','Создать заявку'],['tickets','▤','Мои заявки'],
    ['notifications','🔔','Уведомления'],['profile','☺','Профиль']
  ];
  if(u.role==='executor') return [
    ['incoming','📥','Входящие'],['work','⚙','В работе'],['tickets','▤','Заявки отдела'],
    ['notifications','🔔','Уведомления'],['profile','☺','Профиль']
  ];
  return [
    ['manager','▥','Панель'],['departments','▦','Подразделения'],['workload','⌁','Нагрузка'],
    ['ai','✧','Качество AI'],['reports','▤','Отчёты'],['profile','☺','Профиль']
  ];
}

function titles(){
  return {
    home:['Главная','Ваши заявки и актуальная информация'],
    create:['Создание заявки','Опишите проблему — RouteDesk определит маршрут'],

function myTickets(){
  const u = state.user;
  if(u.role==='employee') return db.tickets.filter(t=>t.authorId===u.id);
  if(u.role==='executor') return db.tickets.filter(t=>t.dept===u.dept);
  return db.tickets.slice();
}

function incomingTickets(){
  const u = state.user;
  let list = db.tickets.filter(t=>t.dept===u.dept && t.status!=='Решена');
  if(state.inTab==='mine') list = list.filter(t=>!t.assigneeId || t.assigneeId===u.id);
  if(state.inPrio!=='Все') list = list.filter(t=>t.priority===state.inPrio);
  list.sort((a,b)=> state.inSort==='old' ? a.createdAt-b.createdAt : b.createdAt-a.createdAt);
  return list;
}

function applyTicketFilters(list){
  const f = state.filters;
  return list.filter(t=>{
    if(f.status!=='Все' && t.status!==f.status) return false;
    if(f.category!=='Все' && t.category!==f.category) return false;
    if(f.from && t.createdAt < new Date(f.from).getTime()) return false;
    if(f.to && t.createdAt > new Date(f.to).getTime()+86400000) return false;
    if(f.q){
      const q = f.q.toLowerCase();
      if(!String(t.id).includes(q) && !t.title.toLowerCase().includes(q) && !t.text.toLowerCase().includes(q)) return false;
    }
    return true;
  }).sort((a,b)=>{
    if(f.sort==='prio'){
      const r = {Высокий:3,Средний:2,Низкий:1};
      return (r[b.priority]||0)-(r[a.priority]||0);
    }
    if(f.sort==='date_asc') return a.createdAt-b.createdAt;
    return b.createdAt-a.createdAt;
  });
}

function stats(days){
  const from = now() - days*86400000;
  const all = db.tickets.filter(t=>t.createdAt>=from);
  const resolved = all.filter(t=>t.status==='Решена');
  const avg = resolved.length
    ? resolved.reduce((s,t)=>s+(t.resolvedAt||now())-t.createdAt,0)/resolved.length/3600000
    : 0;
  const redirected = all.filter(t=>t.redirects>0).length;
  const firstOk = all.length ? Math.round(100*(all.length-redirected)/all.length) : 0;
  const slaOk = resolved.filter(t=>((t.resolvedAt||now())-t.createdAt) <= 8*3600000).length;
  const sla = all.length ? Math.round(100*(slaOk + all.filter(t=>t.status!=='Решена' && now()-t.createdAt<=8*3600000).length)/all.length) : 0;
  const byCat = {};
  DEPTS.forEach(d=> byCat[d]=all.filter(t=>t.category===d).length);
  return {all, total:all.length, resolved:resolved.length, avg, redirected, firstOk, sla, byCat};
}

function deptStats(days){
  const from = now()-days*86400000;
  return DEPTS.map(d=>{
    const list = db.tickets.filter(t=>t.dept===d && t.createdAt>=from);
    const done = list.filter(t=>t.status==='Решена');
    const avg = done.length ? done.reduce((s,t)=>s+(t.resolvedAt-t.createdAt),0)/done.length/3600000 : 0;
    const overdue = list.filter(t=>{
      const end = t.resolvedAt || now();
      return end-t.createdAt > 8*3600000;
    }).length;
    const sla = list.length ? Math.round(100*(list.length-overdue)/list.length) : 100;
    return {d, n:list.length, avg, overdue, sla, queue:list.filter(t=>t.status!=='Решена').length};
  });
}

function doLogin(){
  const login = document.getElementById('login').value.trim().toLowerCase();
  const password = document.getElementById('password').value;
  const u = USERS.find(x=>x.login===login && x.password===password);
  if(!u){ toast('Неверный логин или пароль'); return; }
  state.user = {...u, ...JSON.parse(localStorage.getItem('rd-profile-'+u.id)||'{}')};
  state.screen = u.role==='executor' ? 'incoming' : u.role==='manager' ? 'manager' : 'home';
  toast(`Вход выполнен · роль: ${roleLabel(u)}`);
  render();

function bindApp(){
  document.querySelectorAll('[data-go]').forEach(b=> b.onclick = ()=> go(b.dataset.go));
  document.querySelectorAll('[data-open]').forEach(b=> b.onclick = ()=> openTicket(+b.dataset.open));
  const pb = document.getElementById('periodBtn');
  if(pb) pb.onclick = ()=>{
    state.period = state.period===7?30:state.period===30?90:7;
    render();
  };
  const handlers = window._h || {};
  Object.keys(handlers).forEach(k=>{
    const el = document.getElementById(k);
    if(el) el.onclick = handlers[k];
  });
}

function wireCreate(){
  const desc = document.getElementById('desc');
  if(!desc) return;
  const sync = ()=>{
    state.draft.text = desc.value;
    state.draft.category = document.getElementById('cat').value;
    state.draft.priority = document.getElementById('prio').value;
    document.getElementById('cnt').textContent = desc.value.length+'/1000';
  };
  desc.oninput = sync;
  document.getElementById('cat').onchange = sync;
  document.getElementById('prio').onchange = sync;
  document.getElementById('file').onchange = e=>{
    state.draft.file = e.target.files[0]?.name || '';
    document.getElementById('fileName').textContent = state.draft.file || 'Файл не выбран';
  };
  document.getElementById('analyzeBtn').onclick = ()=>{
    sync();
    if(!state.draft.text.trim()){ toast('Сначала опишите проблему'); return; }
    state.ai = classify(state.draft.text, state.draft.category);
    const box = document.getElementById('aiBox');
    box.style.display='block';
    box.innerHTML = aiBlock(state.ai);
    document.getElementById('submitBtn').onclick = submitTicket;
    toast('AI-анализ завершён');
  };
  if(state.ai) document.getElementById('submitBtn').onclick = submitTicket;
}

function submitTicket(){
  const text = state.draft.text.trim();
  if(!text){ toast('Добавьте описание'); return; }
  const cat = document.getElementById('confirmCat')?.value || state.ai.category;
  const ai = (state.ai && state.ai.category === cat)
    ? state.ai
    : classify(text, cat);
  const title = text.split(/[.!?]/)[0].slice(0,80);
  const ticket = {
    id: db.nextId++, title, text, category:cat, dept:cat, priority:state.draft.priority,
    status:'Назначена', authorId:state.user.id, assigneeId:null, confidence:ai.confidence,
    explanation:ai.explanation, createdAt:now(), resolvedAt:null, file:state.draft.file,
    redirects:0, visited:[cat],
    history:[
      {t:now(), title:'Создана', text:state.user.name, userId:state.user.id, kind:'created'},
      {t:now()+1000, title:'Классифицирована', text:`${cat} · ${ai.confidence}%`, userId:'ai', kind:'ai'},
      {t:now()+2000, title:'Назначена', text:DEPT_FULL[cat], userId:'ai', kind:'assign'}
    ],
    comments:[]
  };
  db.tickets.unshift(ticket);
  USERS.filter(u=>u.role==='executor' && u.dept===cat).forEach(u=>{
    notify(u.id, ticket.id, 'new', `Новая заявка №${ticket.id} в отделе ${DEPT_FULL[cat]}`);
  });
  notify(state.user.id, ticket.id, 'assign', `Заявка №${ticket.id} направлена в ${DEPT_FULL[cat]}`);
  saveDB(db);
  state.draft = {text:'', category:'Автоматически', priority:'Средний', file:''};
  state.ai = null;
  state.selectedId = ticket.id;
  toast(`Заявка №${ticket.id} создана и направлена в ${DEPT_FULL[cat]}`);
  go('ticket');
}

function formatDur(ms){
  const m = Math.max(1, Math.round(ms/60000));
  if(m<60) return m+' мин';
  return (m/60).toFixed(1)+' ч';
}
function stageDurations(t){
  const hs = t.history;
  const items = [];
  for(let i=0;i<hs.length;i++){
    const end = hs[i+1]? hs[i+1].t : (t.resolvedAt||now());
    items.push({name:hs[i].title, ms:Math.max(60000,end-hs[i].t)});
  }
  const sum = items.reduce((s,x)=>s+x.ms,0)||1;
  return items.map(x=>({name:x.name, pct:Math.round(100*x.ms/sum), label:formatDur(x.ms)}));
}

function doRedirect(t){
  const dept = document.getElementById('redirDept').value;
  const why = (document.getElementById('redirWhy').value||'').trim();
  if(!why){ toast('Укажите причину перенаправления'); return; }
  t.dept = dept; t.category = dept; t.status='Перенаправлена'; t.assigneeId=null;
  t.redirects += 1; if(!t.visited.includes(dept)) t.visited.push(dept);
  addHistory(t,'Перенаправлена', `В ${DEPT_FULL[dept]}. Причина: ${why}`, 'redir');
  notify(t.authorId, t.id, 'redirect', `Заявка №${t.id} перенаправлена в ${DEPT_FULL[dept]}`);
  USERS.filter(u=>u.role==='executor' && u.dept===dept).forEach(u=>{
    notify(u.id, t.id, 'new', `Входящая заявка №${t.id} после перенаправления`);
  });
  t.status='Назначена';
  addHistory(t,'Назначена', DEPT_FULL[dept], 'assign');
  saveDB(db); toast('Заявка перенаправлена'); render();
}

function donut(byCat, total){
  let acc=0; const stops=[];
  DEPTS.forEach(d=>{
    const p = total? (byCat[d]/total)*100 : 0;
    stops.push(`${COLORS[d]} ${acc}% ${acc+p}%`); acc+=p;
  });
  return `<div class="donut-wrap"><div class="donut" data-total="${total}" style="background:conic-gradient(${stops.join(',')})"></div>
    <div class="legend">${DEPTS.map(d=>`<span><i class="dot" style="background:${COLORS[d]}"></i>${d} <b>${total?Math.round(100*byCat[d]/total):0}%</b></span>`).join('')}</div></div>`;
}

function confusion(){
  const labels = DEPTS;
  const m = labels.map(()=>labels.map(()=>0));
  db.tickets.forEach(t=>{
    const pred = labels.indexOf(t.history.find(h=>h.kind==='ai') ? t.category : t.category);
    const actual = labels.indexOf(t.visited[t.visited.length-1] || t.dept);
    const i = actual<0?0:actual, j = pred<0?0:pred;
    m[i][j]++;
  });
  const base = [
    [42,3,1,0,1],[4,36,1,2,0],[0,1,28,2,1],[1,2,1,24,0],[1,0,1,0,18]
  ];
  return labels.map((_,i)=> labels.map((_,j)=> (m[i][j]||0)+base[i][j]));
}

function metricsFromMatrix(m){
  const n = m.length; let tp=0, tot=0, prec=0, rec=0;
  for(let i=0;i<n;i++){
    const row = m[i].reduce((a,b)=>a+b,0);
    const col = m.reduce((a,r)=>a+r[i],0);
    tp += m[i][i]; tot += row;
    prec += col? m[i][i]/col : 0;
    rec += row? m[i][i]/row : 0;
  }
  const acc = tot? tp/tot : 0;
  const p = prec/n, r = rec/n, f1 = (p+r)? 2*p*r/(p+r):0;
  return {acc, p, r, f1};
}

function aiHTML(){
  const m = confusion();
  const met = metricsFromMatrix(m);
  const low = db.tickets.filter(t=>t.confidence<75).length;
  const share = db.tickets.length? Math.round(100*low/db.tickets.length) : 6;
  const pct = x=>Math.round(x*100)+'%';
  return `<div class="tabs"><button class="active">Метрики</button><button data-go="ai">Матрица ошибок</button></div>
    <div class="grid kpis">
      <div class="card kpi"><div class="symbol">✧</div><strong>${pct(met.acc)}</strong><span class="muted small">Accuracy</span></div>
      <div class="card kpi"><div class="symbol">◎</div><strong>${pct(met.p)}</strong><span class="muted small">Precision</span></div>
      <div class="card kpi"><div class="symbol">✓</div><strong>${pct(met.r)}</strong><span class="muted small">Recall</span></div>
      <div class="card kpi"><div class="symbol">F</div><strong>${pct(met.f1)}</strong><span class="muted small">F1-score</span></div>
    </div>
    <div class="grid two">
      <div class="card"><h3>Сравнение моделей</h3>
        <div class="metric-line"><b>Rule-based</b><div class="barline"><i style="width:72%"></i></div><em>72%</em></div>
        <div class="metric-line"><b>ruBERT</b><div class="barline"><i style="width:82%"></i></div><em>82%</em></div>
        <div class="metric-line"><b>LLM</b><div class="barline"><i style="width:87%"></i></div><em>87%</em></div>
      </div>
      <div class="card"><h3>Уверенность</h3>
        <div class="metric-line"><b>Высокая</b><div class="barline"><i style="width:68%"></i></div><em>68%</em></div>
        <div class="metric-line"><b>Средняя</b><div class="barline"><i style="width:26%"></i></div><em>26%</em></div>
        <div class="metric-line"><b>Низкая</b><div class="barline"><i style="width:${Math.max(6,share)}%;background:var(--orange)"></i></div><em>${Math.max(6,share)}%</em></div>
        <div class="result" style="margin-top:12px"><b>Доля заявок с низкой уверенностью: ${Math.max(6,share)}%</b>
          <p class="small muted">При низкой уверенности сотрудник подтверждает категорию вручную.</p></div>
      </div>
    </div>
    <div class="card" style="margin-top:16px"><h3>Матрица ошибок</h3>
      <div class="table-wrap"><table class="table"><thead><tr><th></th>${DEPTS.map(d=>`<th>Предсказано ${d}</th>`).join('')}</tr></thead>
      <tbody>${DEPTS.map((d,i)=>`<tr><td>Факт ${d}</td>${m[i].map((v,j)=>`<td class="${i===j?'hit':''}">${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    </div>`;
}

function reportsHTML(){
  const s = stats(state.period);
  const prev = stats(state.period*2);
  const rows = deptStats(state.period);
  return `<div class="card">
    <div class="row">
      <h3>Отчёт за ${state.period} дней</h3>
      <div class="top-actions">
        <button class="chip" id="p7">7 дней</button>
        <button class="chip" id="p30">30 дней</button>
        <button class="chip" id="p90">90 дней</button>
        <button class="ghost" id="cmp">${state.compare?'Скрыть сравнение':'Сравнить периоды'}</button>
        <button class="primary" id="csv">Выгрузить CSV</button>
      </div>
    </div>
    <div class="grid kpis">
      <div class="card kpi"><strong>${s.total}</strong><span class="muted small">Заявок</span>${state.compare?`<span class="small ${s.total>=prev.total/2?'positive':'negative'}">прошлый период ~${Math.round(prev.total/2)}</span>`:''}</div>
      <div class="card kpi"><strong>${s.resolved}</strong><span class="muted small">Решено</span></div>
      <div class="card kpi"><strong>${s.sla}%</strong><span class="muted small">SLA</span></div>
      <div class="card kpi"><strong>${s.redirected}</strong><span class="muted small">С перенаправлением</span></div>
    </div>
    <h3>По подразделениям</h3>
    <div class="table-wrap"><table class="table"><thead><tr><th>Отдел</th><th>Заявок</th><th>Очередь</th><th>SLA</th><th>Среднее время</th></tr></thead>
    <tbody>${rows.map(r=>`<tr><td>${r.d}</td><td>${r.n}</td><td>${r.queue}</td><td>${r.sla}%</td><td>${r.avg?r.avg.toFixed(1)+' ч':'—'}</td></tr>`).join('')}</tbody></table></div>
  </div>`;
}

function wireReports(){
  const setP = d=>{ state.period=d; render(); };
  document.getElementById('p7').onclick=()=>setP(7);
  document.getElementById('p30').onclick=()=>setP(30);
  document.getElementById('p90').onclick=()=>setP(90);
  document.getElementById('cmp').onclick=()=>{ state.compare=!state.compare; render(); };
  document.getElementById('csv').onclick=exportCSV;
}

function exportCSV(){
  const rows = deptStats(state.period);
  const lines = [['Подразделение','Заявок','Очередь','Просрочено','SLA','Среднее_часы'].join(';')];
  rows.forEach(r=> lines.push([r.d,r.n,r.queue,r.overdue,r.sla,(r.avg||0).toFixed(2)].join(';')));
  const blob = new Blob(['\uFEFF'+lines.join('\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`routedesk-${state.period}d.csv`; a.click();
  toast('Файл отчёта скачан');
}

const _render = render;
render = function(){
  _render();
  if(!state.user) return;
  if(state.screen==='create') wireCreate();
  if(['tickets','incoming','work'].includes(state.screen)) wireList();
  if(state.screen==='ticket') wireTicket();
  if(state.screen==='profile') wireProfile();
  if(state.screen==='reports') wireReports();
};

render();
</script>
